<script>
const API_URL =
  "https://smartcaption-ai.pandyasharad81.workers.dev/";

const videoInput =
  document.getElementById("videoInput");

const videoPreview =
  document.getElementById("videoPreview");

const fileStatus =
  document.getElementById("fileStatus");

const generateBtn =
  document.getElementById("generateBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const language =
  document.getElementById("language");

const captionStyle =
  document.getElementById("captionStyle");

const transcript =
  document.getElementById("transcript");

const captionPreview =
  document.getElementById("captionPreview");

const segmentsBox =
  document.getElementById("segments");

const statusBox =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");

let selectedFile = null;
let generatedChunks = [];


// -----------------------------
// VIDEO SELECT
// -----------------------------

videoInput.addEventListener("change", () => {

  const file = videoInput.files[0];

  if (!file) return;

  selectedFile = file;

  videoPreview.src =
    URL.createObjectURL(file);

  videoPreview.classList.remove("hidden");

  fileStatus.textContent =
    "✅ Selected: " + file.name;
});


// -----------------------------
// LANGUAGE
// -----------------------------

function getLanguageCode() {

  if (language.value === "gujarati")
    return "gu";

  if (language.value === "hindi")
    return "hi";

  return "en";
}


// -----------------------------
// RECORD AUDIO FROM VIDEO
// -----------------------------

async function recordVideoAudio(file) {

  const url =
    URL.createObjectURL(file);

  videoPreview.src = url;

  await new Promise((resolve, reject) => {

    videoPreview.onloadedmetadata =
      () => resolve();

    videoPreview.onerror =
      () => reject(
        new Error("Could not load video.")
      );
  });


  const stream =
    videoPreview.captureStream
      ? videoPreview.captureStream()
      : videoPreview.mozCaptureStream();


  if (!stream) {

    throw new Error(
      "Your browser does not support video audio capture. Please use Chrome."
    );
  }


  const audioTracks =
    stream.getAudioTracks();


  if (!audioTracks.length) {

    throw new Error(
      "This video does not contain an audio track."
    );
  }


  const audioStream =
    new MediaStream(audioTracks);


  let mimeType =
    "audio/webm;codecs=opus";


  if (
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ) {

    mimeType = "audio/webm";
  }


  if (
    !MediaRecorder.isTypeSupported(
      mimeType
    )
  ) {

    throw new Error(
      "Audio recording is not supported by this browser."
    );
  }


  const recorder =
    new MediaRecorder(
      audioStream,
      {
        mimeType
      }
    );


  const chunks = [];


  recorder.ondataavailable =
    event => {

      if (
        event.data &&
        event.data.size > 0
      ) {

        chunks.push(event.data);
      }
    };


  const finished =
    new Promise((resolve, reject) => {

      recorder.onstop = () => {

        resolve(
          new Blob(
            chunks,
            { type: mimeType }
          )
        );
      };

      recorder.onerror = event => {

        reject(
          event.error ||
          new Error(
            "Audio recording failed."
          )
        );
      };

    });


  videoPreview.currentTime = 0;

  recorder.start();


  statusBox.textContent =
    "🎧 Reading video audio...";


  await videoPreview.play();


  await new Promise(resolve => {

    videoPreview.onended =
      () => resolve();

  });


  recorder.stop();


  const audioBlob =
    await finished;


  audioTracks.forEach(
    track => track.stop()
  );


  videoPreview.pause();

  URL.revokeObjectURL(url);


  return audioBlob;
}


// -----------------------------
// BLOB TO BASE64
// -----------------------------

async function blobToBase64(blob) {

  const buffer =
    await blob.arrayBuffer();

  const bytes =
    new Uint8Array(buffer);

  let binary = "";

  const chunkSize = 0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    const chunk =
      bytes.subarray(
        i,
        i + chunkSize
      );

    binary +=
      String.fromCharCode(
        ...chunk
      );
  }


  return btoa(binary);
}


// -----------------------------
// GENERATE AI CAPTIONS
// -----------------------------

generateBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {

      alert(
        "Please select a video first."
      );

      return;
    }


    generateBtn.disabled = true;

    progressBar.style.width =
      "10%";


    try {

      statusBox.textContent =
        "🎬 Preparing your video...";


      progressBar.style.width =
        "20%";


      const audioBlob =
        await recordVideoAudio(
          selectedFile
        );


      progressBar.style.width =
        "45%";


      statusBox.textContent =
        "📡 Sending audio to AI...";


      const audioBase64 =
        await blobToBase64(
          audioBlob
        );


      progressBar.style.width =
        "60%";


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                audio:
                  audioBase64,

                language:
                  getLanguageCode()
              })
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(
          "AI server error: " +
          response.status +
          " " +
          errorText
        );
      }


      const result =
        await response.json();


      if (!result.success) {

        throw new Error(
          result.error ||
          "AI transcription failed."
        );
      }


      progressBar.style.width =
        "85%";


      const text =
        result.text || "";


      transcript.value =
        text;


      generatedChunks =
        result.segments || [];


      // fallback to VTT
      if (
        !generatedChunks.length &&
        result.vtt
      ) {

        generatedChunks =
          parseVTT(
            result.vtt
          );
      }


      captionPreview.textContent =
        text ||
        "No speech detected.";


      applyStyle();

      renderTimeline();


      progressBar.style.width =
        "100%";


      statusBox.textContent =
        "✅ AI captions generated!";


    } catch (error) {

      console.error(error);

      statusBox.textContent =
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        );


      alert(
        error.message ||
        "Caption generation failed."
      );

    } finally {

      generateBtn.disabled =
        false;
    }

  }
);


// -----------------------------
// TIMELINE
// -----------------------------

function renderTimeline() {

  if (!generatedChunks.length) {

    segmentsBox.innerHTML =
      "No timestamped captions returned.";

    return;
  }


  segmentsBox.innerHTML = "";


  generatedChunks.forEach(
    (segment, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "chunk";


      const start =
        segment.start ??
        segment.timestamp?.[0] ??
        0;


      const end =
        segment.end ??
        segment.timestamp?.[1] ??
        start + 3;


      const text =
        segment.text ||
        "";


      item.innerHTML = `
        <div class="time">
          ${formatTime(start)}
          →
          ${formatTime(end)}
        </div>

        <div>
          ${escapeHtml(text)}
        </div>
      `;


      segmentsBox.appendChild(
        item
      );
    }
  );
}


// -----------------------------
// VTT PARSER
// -----------------------------

function parseVTT(vtt) {

  const result = [];

  const blocks =
    vtt
      .replace(/\r/g, "")
      .split("\n\n");


  for (
    const block of blocks
  ) {

    const lines =
      block.split("\n");


    const timeIndex =
      lines.findIndex(
        line =>
          line.includes("-->")
      );


    if (timeIndex === -1)
      continue;


    const times =
      lines[timeIndex]
        .split("-->");


    const start =
      parseTime(
        times[0].trim()
      );


    const end =
      parseTime(
        times[1].trim()
      );


    const text =
      lines
        .slice(timeIndex + 1)
        .join(" ")
        .trim();


    if (text) {

      result.push({
        start,
        end,
        text
      });
    }
  }


  return result;
}


// -----------------------------
// TIME PARSER
// -----------------------------

function parseTime(value) {

  const parts =
    value.split(":");


  let hours = 0;
  let minutes = 0;
  let seconds = 0;


  if (parts.length === 3) {

    hours =
      Number(parts[0]);

    minutes =
      Number(parts[1]);

    seconds =
      Number(parts[2]);

  } else {

    minutes =
      Number(parts[0]);

    seconds =
      Number(parts[1]);
  }


  return (
    hours * 3600 +
    minutes * 60 +
    seconds
  );
}


// -----------------------------
// CAPTION STYLE
// -----------------------------

captionStyle.addEventListener(
  "change",
  applyStyle
);


function applyStyle() {

  captionPreview.style.padding =
    "";

  captionPreview.style.borderRadius =
    "";


  if (
    captionStyle.value ===
    "yellow"
  ) {

    captionPreview.style.color =
      "#fde047";

    captionPreview.style.textShadow =
      "3px 3px 8px black";

    captionPreview.style.background =
      "transparent";

  }

  else if (
    captionStyle.value ===
    "box"
  ) {

    captionPreview.style.color =
      "white";

    captionPreview.style.textShadow =
      "none";

    captionPreview.style.background =
      "rgba(0,0,0,.75)";

    captionPreview.style.padding =
      "12px 20px";

    captionPreview.style.borderRadius =
      "10px";

  }

  else {

    captionPreview.style.color =
      "white";

    captionPreview.style.textShadow =
      "3px 3px 8px black";

    captionPreview.style.background =
      "transparent";
  }
}


// -----------------------------
// DOWNLOAD SRT
// -----------------------------

downloadBtn.addEventListener(
  "click",
  () => {

    if (
      !generatedChunks.length
    ) {

      alert(
        "Generate captions first."
      );

      return;
    }


    let srt = "";


    generatedChunks.forEach(
      (segment, index) => {

        const start =
          segment.start ??
          segment.timestamp?.[0] ??
          0;


        const end =
          segment.end ??
          segment.timestamp?.[1] ??
          start + 3;


        const text =
          (
            segment.text ||
            ""
          ).trim();


        srt +=
          `${index + 1}\n`;


        srt +=
          `${formatSRT(start)} --> ${formatSRT(end)}\n`;


        srt +=
          `${text}\n\n`;
      }
    );


    const blob =
      new Blob(
        [srt],
        {
          type:
            "text/plain;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "smartcaption.srt";


    link.click();


    URL.revokeObjectURL(url);
  }
);


// -----------------------------
// FORMAT TIME
// -----------------------------

function formatTime(seconds) {

  if (
    seconds === undefined ||
    seconds === null
  )
    return "--:--";


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  return (
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(secs)
      .padStart(2, "0")
  );
}


function formatSRT(seconds) {

  const hours =
    Math.floor(
      seconds / 3600
    );


  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  const millis =
    Math.floor(
      (
        seconds -
        Math.floor(seconds)
      ) * 1000
    );


  return (
    String(hours).padStart(2, "0") +
    ":" +
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0") +
    "," +
    String(millis).padStart(3, "0")
  );
}


// -----------------------------
// HTML SAFETY
// -----------------------------

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>
