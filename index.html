<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCaption AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 46px;
    }

    header p {
      font-size: 18px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 28px;
      margin-bottom: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .upload-box {
      border: 2px dashed #2563eb;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      background: #eff6ff;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover {
      background: #1d4ed8;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      color: #2563eb;
    }

    .preview {
      min-height: 180px;
      background: #111827;
      color: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>SmartCaption AI</h1>
    <p>AI-powered Gujarati, Hindi & English video captions</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🎬 Upload Your Video</h2>

      <div class="upload-box">
        <p>Upload your video to create captions</p>

        <input
          type="file"
          id="videoInput"
          accept="video/*"
        >

        <div id="fileStatus" class="status"></div>
      </div>

      <video
        id="videoPreview"
        controls
        style="display:none;">
      </video>
    </div>


    <div class="card">
      <h2>⚙️ Caption Settings</h2>

      <label>Language</label>

      <select id="language">
        <option value="gu">Gujarati</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
      </select>

      <label>Caption Style</label>

      <select id="style">
        <option value="modern">Modern</option>
        <option value="yellow">Yellow</option>
        <option value="box">Black Box</option>
      </select>

      <button onclick="showDemo()">
        ✨ Generate AI Captions
      </button>

      <div
        id="status"
        class="status">
        Ready
      </div>
    </div>


    <div class="card">

      <h2>👀 Caption Preview</h2>

      <div
        id="captionPreview"
        class="preview">

        Upload a video and generate captions.

      </div>

    </div>


    <div class="card">

      <h2>✏️ Caption Editor</h2>

      <textarea
        id="transcript"
        placeholder="Your AI-generated captions will appear here...">
      </textarea>

      <button onclick="downloadText()">
        ⬇ Download Caption Text
      </button>

    </div>

  </div>


  <script>

    const videoInput =
      document.getElementById("videoInput");

    const videoPreview =
      document.getElementById("videoPreview");

    const fileStatus =
      document.getElementById("fileStatus");


    videoInput.addEventListener(
      "change",
      function () {

        const file =
          this.files[0];

        if (!file) return;

        videoPreview.src =
          URL.createObjectURL(file);

        videoPreview.style.display =
          "block";

        fileStatus.textContent =
          "✅ Selected: " + file.name;
      }
    );


    function showDemo() {

      const language =
        document.getElementById(
          "language"
        ).value;

      const preview =
        document.getElementById(
          "captionPreview"
        );

      const transcript =
        document.getElementById(
          "transcript"
        );

      if (language === "gu") {

        preview.textContent =
          "આ તમારું Gujarati caption છે";

        transcript.value =
          "આ તમારું Gujarati caption છે";

      } else if (language === "hi") {

        preview.textContent =
          "यह आपका Hindi caption है";

        transcript.value =
          "यह आपका Hindi caption है";

      } else {

        preview.textContent =
          "This is your English caption";

        transcript.value =
          "This is your English caption";
      }

      document.getElementById(
        "status"
      ).textContent =
        "✅ Caption preview generated";
    }


    function downloadText() {

      const text =
        document.getElementById(
          "transcript"
        ).value;

      if (!text) {

        alert(
          "Please generate or enter captions first."
        );

        return;
      }

      const blob =
        new Blob(
          [text],
          { type: "text/plain" }
        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "smartcaption.txt";

      a.click();

      URL.revokeObjectURL(url);
    }

  </script>

</body>
</html>
