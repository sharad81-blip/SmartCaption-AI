<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCaption AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 46px;
    }

    header p {
      font-size: 18px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 28px;
      margin-bottom: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .upload-box {
      border: 2px dashed #2563eb;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      background: #eff6ff;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover {
      background: #1d4ed8;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      color: #2563eb;
    }

    .preview {
      min-height: 180px;
      background: #111827;
      color: white;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>SmartCaption AI</h1>
  <p>AI-powered Gujarati, Hindi & English video captions</p>
</header>

<div class="container">

  <div class="card">
    <h2>🎬 Upload Your Video</h2>

    <div class="upload-box">
      <p>Upload your video</p>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <div
        id="fileStatus"
        class="status">
      </div>
    </div>

    <video
      id="videoPreview"
      controls
      class="hidden">
    </video>
  </div>


  <div class="card">
    <h2>⚙️ Caption Settings</h2>

    <label>Language</label>

    <select id="language">
      <option value="gu">Gujarati</option>
      <option value="hi">Hindi</option>
      <option value="en">English</option>
    </select>

    <label>Caption Style</label>

    <select id="captionStyle">
      <option value="modern">Modern</option>
      <option value="yellow">Yellow</option>
      <option value="box">Black Box</option>
    </select>

    <button
      id="generateBtn">
      ✨ Generate AI Captions
    </button>

    <div
      id="status"
      class="status">
      Ready
    </div>
  </div>


  <div class="card">
    <h2>👀 Caption Preview</h2>

    <div
      id="captionPreview"
      class="preview">
      Upload a video to begin.
    </div>
  </div>


  <div class="card">

    <h2>✏️ Caption Editor</h2>

    <textarea
      id="transcript"
      placeholder="Generated captions will appear here...">
    </textarea>

    <button id="downloadBtn">
      ⬇ Download SRT
    </button>

  </div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const videoPreview =
  document.getElementById("videoPreview");

const fileStatus =
  document.getElementById("fileStatus");

const generateBtn =
  document.getElementById("generateBtn");

const statusBox =
  document.getElementById("status");

const captionPreview =
  document.getElementById("captionPreview");

const transcript =
  document.getElementById("transcript");

const downloadBtn =
  document.getElementById("downloadBtn");

const language =
  document.getElementById("language");


let selectedFile = null;


// Video upload
videoInput.addEventListener(
  "change",
  function () {

    const file = this.files[0];

    if (!file) {
      return;
    }

    selectedFile = file;

    videoPreview.src =
      URL.createObjectURL(file);

    videoPreview.classList.remove(
      "hidden"
    );

    fileStatus.textContent =
      "✅ Selected: " +
      file.name;

    statusBox.textContent =
      "Video ready.";
  }
);


// Temporary test button
generateBtn.addEventListener(
  "click",
  function () {

    if (!selectedFile) {

      alert(
        "Please upload a video first."
      );

      return;
    }

    const lang =
      language.value;

    let text = "";

    if (lang === "gu") {

      text =
        "આ Gujarati caption test છે.";

    } else if (lang === "hi") {

      text =
        "यह Hindi caption test है।";

    } else {

      text =
        "This is an English caption test.";
    }

    transcript.value =
      text;

    captionPreview.textContent =
      text;

    statusBox.textContent =
      "✅ Caption preview generated.";
  }
);


// SRT download
downloadBtn.addEventListener(
  "click",
  function () {

    const text =
      transcript.value.trim();

    if (!text) {

      alert(
        "Generate captions first."
      );

      return;
    }

    const srt =
      "1\n" +
      "00:00:00,000 --> 00:00:05,000\n" +
      text +
      "\n";

    const blob =
      new Blob(
        [srt],
        {
          type:
            "text/plain"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "smartcaption.srt";

    link.click();

    URL.revokeObjectURL(url);
  }
);

</script>

</body>
</html>
