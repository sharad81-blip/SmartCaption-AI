<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCaption AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 50px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .box {
      background: white;
      width: 80%;
      max-width: 700px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>SmartCaption AI</h1>
    <p>Create captions for your videos easily</p>
  </header>

  <div class="box">
    <h2>Upload Your Video</h2>
    <p>Gujarati • Hindi • English</p>

    <input type="file" accept="video/*">
    <br><br>

    <button>Generate Captions</button>
  </div>

</body>
</html>
